# Coder (code-server workspaces). The most common report is "coder is not
# responding", which is almost always one of: the deployment has no ready
# replicas, the ingress is returning 5xx while pods are healthy, or workspace
# pods cannot schedule for want of GPU/CPU.
service: coder
match: ["coder", "code-server", "workspace", "workspaces"]
namespaces: ["coder"]
docs_hints:
  - "admindocs/upgrades/coder"
  - "userdocs/coder/coder"
  - "userdocs/coder/deploy"
steps:
  - name: workload health
    tool: get_workload
    args: {kind: deployment, namespace: coder, name: coder}
    note: >-
      ready < desired means the control plane itself is down for users.
      generation != observedGeneration means a rollout is stuck.

  - name: pod restarts and states
    tool: list_pods
    args: {namespace: coder}
    note: CrashLoopBackOff here points at the pod; Pending points at scheduling.

  - name: ingress error rate
    tool: promql
    args:
      query: 'sum(rate(haproxy_backend_http_responses_total{proxy="coder_coder_http",code="5xx"}[5m]))'
    note: >-
      Verified against live Thanos. NRP fronts services with haproxy, not the
      nginx ingress controller -- no nginx_ingress_controller_* metric exists on
      this cluster, so the previous query returned an empty result rather than an
      error, which reads exactly like "no errors". Backends are named
      <namespace>_<service>_<port>. Non-zero with healthy pods means the failure
      is between the ingress and the service, not in coder itself.

  - name: ingress request rate baseline
    tool: promql
    args:
      query: 'sum(rate(haproxy_backend_http_requests_total{proxy="coder_coder_http"}[5m]))'
      lookback: 6h
      step: 5m
    note: >-
      Verified against live Thanos. A rate that fell to zero means users stopped
      reaching the ingress at all -- look at DNS/LB, not at coder. Sits around
      1 req/s when healthy.

  - name: recent events
    tool: get_events
    args: {namespace: coder, since_seconds: 3600}

  - name: node conditions
    tool: list_nodes
    args: {only_unhealthy: true}
    note: Only relevant if pods are Pending or were evicted.

  - name: runbook
    tool: search_docs
    args: {query: "coder deployment upgrade rollback", section: admindocs}
