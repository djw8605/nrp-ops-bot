[project]
name = "nrp-ops-agent"
version = "0.1.0"
description = "Read-only Slack operations agent for the National Research Platform (Nautilus) Kubernetes cluster"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "slack-bolt>=1.21",
    "aiohttp>=3.10",
    "kubernetes-asyncio>=31.1",
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
nrp-ops-agent = "nrp_ops_agent.slack_app:main"
nrp-ops-docs-sync = "nrp_ops_agent.docs_index.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nrp_ops_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit
    "ASYNC",    # flake8-async
    "RUF",
]
ignore = [
    "S101",  # assert: used throughout the test suite
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # hardcoded fake credentials are the point of these tests

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
mypy_path = "src"
packages = ["nrp_ops_agent"]

[[tool.mypy.overrides]]
module = ["kubernetes_asyncio.*", "fastmcp.*", "slack_bolt.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:nrp_ops_agent.*"]
