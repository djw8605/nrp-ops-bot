# Points the agent at a local `kubectl proxy` instead of the API server.
#
#   kubectl proxy --port=8001 &
#   export NRP_OPS_KUBE_MODE=kubeconfig
#   export NRP_OPS_KUBECONFIG_PATH=dev/kubeconfig-proxy.yaml
#
# Why this exists, rather than just using ~/.kube/config directly:
#
#  1. TLS. NRP's API server certificate has no Authority Key Identifier
#     extension. OpenSSL 3.x (Python 3.13 on macOS ships 3.6) rejects it with
#     "certificate verify failed: Missing Authority Key Identifier", so every
#     Kubernetes tool fails while kubectl on the same machine works fine.
#  2. OIDC. The `nautilus` context authenticates through an OIDC provider and
#     kubectl refreshes that token itself. kubectl proxy therefore also keeps
#     credential handling in the one tool that definitely implements it.
#
# The proxy listens on loopback and speaks plain HTTP, which is why there are no
# credentials here -- kubectl holds them. Nothing about this file is used in the
# cluster, where NRP_OPS_KUBE_MODE=incluster and the ServiceAccount CA applies.
apiVersion: v1
kind: Config
current-context: kubectl-proxy
clusters:
  - name: kubectl-proxy
    cluster:
      server: http://127.0.0.1:8001
contexts:
  - name: kubectl-proxy
    context:
      cluster: kubectl-proxy
      user: kubectl-proxy
users:
  - name: kubectl-proxy
    user: {}
