---
# Hot-reloaded policy. The agent watches this file's mtime and re-reads it, so
# adding an operator is `kubectl apply`, not a redeploy.
#
# A corrupt edit is not fail-open: the running agent keeps the last policy it
# successfully validated, and a fresh pod that cannot parse this file starts
# with an empty (deny-everything) policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-ops-agent-allowlist
  namespace: nrp-ops-agent
  labels:
    app.kubernetes.io/name: nrp-ops-agent
data:
  allowlist.yaml: |
    # WHO the bot answers. This is the check that decides "specific people":
    # it runs before the channel check and applies to DMs and channels alike, so
    # a non-operator is refused even in an allowlisted channel.
    #
    # Slack user IDs only (U.../W...). Never display names or emails -- users can
    # change those at will, and authz.SlackEvent has no field for either.
    # Get one: click the person in Slack -> View full profile -> ... (More)
    # -> Copy member ID.
    #
    # An empty list denies everyone. So does a list of placeholders, which looks
    # identical from the outside: the bot connects, logs authz_deny, and answers
    # nobody.
    operators:
      - U00000000000  # TODO: replace with real operator IDs before deploying

    # WHERE @mentions are honoured, as a second gate on top of `operators`.
    # A channel mention needs BOTH: an allowlisted user in an allowlisted
    # channel. DMs skip this list and are governed by NRP_OPS_SLACK_ALLOW_DMS
    # (default true) -- they are still restricted to `operators`.
    #
    # Slack channel IDs (C.../G...), not names: names are mutable and #ops in
    # one workspace is not #ops in another. Get one from the channel header ->
    # the channel name -> About, at the bottom; or from a copied message link,
    # where it is the /archives/C... segment.
    #
    # Listing a channel does NOT put the bot in it. Slack only delivers
    # app_mention events for channels the bot has joined, so also run
    # `/invite @nrp-ops` there -- otherwise the mention never arrives and the
    # audit log shows nothing at all, not even a denial.
    channels:
      - C00000000000  # TODO: replace with the ops channel ID

    # fnmatch globs. Deny-by-default: a namespace matching nothing here is
    # refused inside the tool, before any API call is made.
    #
    # Verified 2026-08-14 against live kube-state-metrics via thanos.nrp-nautilus.io.
    # The earlier list named `jupyterhub`, `rook-ceph` and `nvidia-device-plugin`,
    # none of which exist on this cluster -- every Ceph and JupyterHub question
    # would have been denied before reaching the API.
    namespaces:
      - coder            # deployment/coder
      - coder-dev
      - coder-user-dev
      - jupyterlab       # z2jh lives here, NOT in `jupyterhub`; deployments hub + proxy
      - jupyterlab-east
      - "rook"           # nine independent Ceph clusters, one namespace each
      - "rook-*"         # central, east, ucsd, tide, south-east, pacific, haosu, fullerton, system
      - gpu-operator     # daemonset/nvidia-device-plugin-daemonset

    # Wins over `namespaces` even on an exact match. Keep the control plane and
    # anything holding cluster-wide credentials out of reach of pod logs.
    namespaces_denied:
      - kube-system
      - kube-public
      - kube-node-lease
      - cert-manager
      - nrp-ops-agent
