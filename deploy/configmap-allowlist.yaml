---
# Hot-reloaded policy. The agent watches this file's mtime and re-reads it, so
# adding an operator is `kubectl apply`, not a redeploy.
#
# A corrupt edit is not fail-open: the running agent keeps the last policy it
# successfully validated, and a fresh pod that cannot parse this file starts
# with an empty (deny-everything) policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nrp-ops-agent-allowlist
  namespace: system-nrp-ops-bot
  labels:
    app.kubernetes.io/name: nrp-ops-agent
data:
  allowlist.yaml: |
    # WHO the bot answers. This is the check that decides "specific people":
    # it runs before the channel check and applies to DMs and channels alike, so
    # a non-operator is refused even in an allowlisted channel.
    #
    # Slack user IDs only (U.../W...). Never display names or emails -- users can
    # change those at will, and authz.SlackEvent has no field for either.
    # Get one: click the person in Slack -> View full profile -> ... (More)
    # -> Copy member ID.
    #
    # An empty list denies everyone. So does a list of placeholders, which looks
    # identical from the outside: the bot connects, logs authz_deny, and answers
    # nobody.
    # Names are comments for whoever edits this next; only the IDs are read.
    # Removing someone here takes effect on the next mtime poll -- no redeploy,
    # and no restart needed.
    operators:
      - U0B2EJ5Q760  # Derek
      - U0B2EJ6FAGL  # Daniel
      - U0B2EEL3R7W  # Sam
      - U0B27J7018D  # Huijun
      - U0B27J4PM29  # Ashton

    # WHERE @mentions are honoured, as a second gate on top of `operators`.
    # A channel mention needs BOTH: an allowlisted user in an allowlisted
    # channel. DMs skip this list and are governed by NRP_OPS_SLACK_ALLOW_DMS
    # (default true) -- they are still restricted to `operators`.
    #
    # Slack channel IDs (C.../G...), not names: names are mutable and #ops in
    # one workspace is not #ops in another. Get one from the channel header ->
    # the channel name -> About, at the bottom; or from a copied message link,
    # where it is the /archives/C... segment.
    #
    # Listing a channel does NOT put the bot in it. Slack only delivers
    # app_mention events for channels the bot has joined, so also run
    # `/invite @nrp-ops` there -- otherwise the mention never arrives and the
    # audit log shows nothing at all, not even a denial.
    channels:
      - C0B1VGA726T  # the ops channel -- remember `/invite @nrp-ops` here

    # fnmatch globs, matched inside every k8s tool before any API call.
    #
    # `*` matches every namespace, so this is NO LONGER deny-by-default: the
    # only namespace boundary left is `namespaces_denied` below. Anything absent
    # from that list is readable -- pod logs, events and annotations included --
    # across every tenant on the cluster.
    #
    # It replaces the explicit list that was verified 2026-08-14 against live
    # kube-state-metrics:
    #   coder, coder-dev, coder-user-dev, jupyterlab, jupyterlab-east,
    #   rook, rook-*, gpu-operator
    # Restore those here to go back to enumerated access.
    namespaces:
      - "*"

    # With `namespaces: ["*"]` above, this is the entire boundary rather than a
    # backstop -- it wins over `namespaces` even on an exact match. Add any
    # namespace whose pod logs should stay unreadable.
    #
    # `system-nrp-ops-bot` -- the bot's own namespace -- was denied here until
    # 2026-08-14, so self-triage ("why am I crashlooping?") failed with the same
    # message as a genuinely out-of-scope tenant. It is now readable, which is
    # deliberate and has two consequences worth knowing:
    #   * the bot can read its own pod logs, i.e. the audit trail, which is the
    #     pre-redaction side of what `redact.py` scrubs on the way out to Slack;
    #   * it can read its own Deployment and this ConfigMap, so the operator IDs
    #     and channel IDs above are reachable via a k8s tool call.
    # Both are bounded by `operators` -- only allowlisted humans get answers at
    # all. Re-add the namespace below to reverse this.
    namespaces_denied:
      - kube-system
      - kube-public
      - kube-node-lease
      - cert-manager
