---
# The agent and the docs indexer run as two containers in one pod, sharing the
# index over an emptyDir.
#
# This used to be a Deployment plus a CronJob plus an RWX CephFS PVC, and that
# arrangement never once produced an index: the CSI driver did not apply the
# pod's fsGroup, so the volume root stayed root:root 0755 and every run of the
# job died writing to it. Nothing running as 65532 can chown that, and under the
# restricted Pod Security this namespace is meant to carry no initContainer can
# run as root to do it either -- the fix was cluster-side, on the CSI driver or
# the volume, and out of this repo's hands.
#
# An emptyDir has no such failure mode: the kubelet creates it per pod and
# applies fsGroup unconditionally, with no CSI driver in the path. What it costs
# is persistence -- the index is rebuilt when the pod restarts, roughly a minute
# of one CPU for ~870 chunks -- and that is the whole of the trade. Nothing else
# wanted the PVC: one replica, Recreate strategy, and a corpus that is a git
# clone away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrp-ops-agent
  namespace: system-nrp-ops-bot
  labels:
    app.kubernetes.io/name: nrp-ops-agent
spec:
  # Exactly one. Socket Mode delivers each event to a single connection, but two
  # replicas would each open one and both would answer the same mention.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nrp-ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nrp-ops-agent
    spec:
      serviceAccountName: nrp-ops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Placeholder. deploy/kustomization.yaml rewrites this to the real
          # registry and tag; the CI bump job edits it there, never here.
          image: ghcr.io/nrp/nrp-ops-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["nrp-ops-agent"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            # Slack and LLM credentials. Create with:
            #   kubectl -n system-nrp-ops-bot create secret generic nrp-ops-agent-tokens \
            #     --from-literal=NRP_OPS_SLACK_BOT_TOKEN=xoxb-... \
            #     --from-literal=NRP_OPS_SLACK_APP_TOKEN=xapp-... \
            #     --from-literal=NRP_OPS_LLM_API_KEY=...
            - secretRef:
                name: nrp-ops-agent-tokens
          env:
            # The NRP workspace (nrp-chat.slack.com), confirmed via auth.test
            # on 2026-08-14. An identifier, not a credential -- it belongs in
            # git. Events from any other team are refused, which is what closes
            # the Slack Connect hole: the *envelope* team is checked, never the
            # inner event's team, which for a Connect message is the author's
            # workspace rather than this one.
            - name: NRP_OPS_SLACK_TEAM_ID
              value: "T0B355062KS"
            - name: NRP_OPS_ALLOWLIST_PATH
              value: /etc/nrp-ops-agent/allowlist.yaml
            - name: NRP_OPS_KUBE_MODE
              value: incluster
            - name: NRP_OPS_PROMETHEUS_BASE_URL
              value: https://thanos.nrp-nautilus.io
            # The read-only accounting MCP server from djw8605/nrp-clickhouse.
            # The whole endpoint, not a base path: that server mounts the MCP
            # transport at "/" and the (unused) OpenAPI bridge under /openapi.
            # No credential -- it is unauthenticated by design, and what bounds
            # this bot's reach into it is the five typed tools in
            # tools/accounting.py, not the network.
            - name: NRP_OPS_ACCOUNTING_MCP_URL
              value: https://nrp-accounting-mcp.nrp-nautilus.io/
            - name: NRP_OPS_LLM_BASE_URL
              value: https://ellm.nrp-nautilus.io/v1
            # Verified to emit OpenAI-style tool_calls, which the loop depends
            # on. Not a secret, so it is set here rather than in the Secret --
            # and it MUST be, because an explicit `env` entry overrides the same
            # key arriving via `envFrom`: an empty value here would win over a
            # correct one in the Secret and the pod would refuse to start.
            - name: NRP_OPS_LLM_MODEL
              value: "deepseek-v4-flash"
            - name: NRP_OPS_DOCS_DB_PATH
              value: /var/lib/nrp-ops-agent/docs.sqlite3
            - name: NRP_OPS_AUDIT_STREAM
              value: stdout
            - name: NRP_OPS_RATE_LIMIT_PER_HOUR
              value: "10"
          volumeMounts:
            - name: allowlist
              mountPath: /etc/nrp-ops-agent
              readOnly: true
            # Read-only even though the sidecar next door writes it: the agent
            # has no business editing its own index, and the mount is the only
            # thing enforcing that now that they share a pod.
            - name: docs
              mountPath: /var/lib/nrp-ops-agent
              readOnly: true
            # readOnlyRootFilesystem means anything that writes needs an explicit
            # mount. These are the only two paths that do.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import nrp_ops_agent"]
            initialDelaySeconds: 15
            periodSeconds: 60

        # Rebuilds the docs index in place, hourly, for as long as the pod
        # lives. `--every` is what makes this a sidecar rather than a job: there
        # is no controller left to re-run it, so the schedule is inside the
        # process. It never exits on a failed rebuild -- a docs mirror outage
        # must not CrashLoopBackOff a container sitting next to a healthy agent
        # -- so a red docs index shows up in this container's log and in
        # search_docs, not in the pod's restart count.
        #
        # An ordinary container rather than a native sidecar (an initContainer
        # with restartPolicy: Always) on purpose: on a cluster older than 1.29
        # that field is pruned, which would turn this into an init container
        # that loops forever and a pod that never starts. The ordering it would
        # buy is not needed -- the agent tolerates a missing index and says so.
        #
        # One thing the CronJob had that this does not: the job set
        # automountServiceAccountToken: false, and a container in this pod gets
        # the agent's token whether it wants it or not. The indexer talks to
        # GitLab and a file, never to the API server, so it never reads it --
        # but a pod-level setting cannot be scoped to one container, and taking
        # the token away here would break the agent beside it.
        - name: docs-sync
          # Placeholder, like the agent's above: deploy/kustomization.yaml
          # rewrites both, so one image bump still moves the pair.
          image: ghcr.io/nrp/nrp-ops-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["nrp-ops-docs-sync", "--every", "3600"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NRP_OPS_DOCS_REPO_URL
              value: https://gitlab.nrp-nautilus.io/prp/nrp-site.git
            # Same path the agent reads, on the shared emptyDir below.
            - name: NRP_OPS_DOCS_DB_PATH
              value: /var/lib/nrp-ops-agent/docs.sqlite3
            - name: NRP_OPS_DOCS_SITE_BASE_URL
              value: https://nrp.ai
            - name: NRP_OPS_AUDIT_STREAM
              value: stdout
            # git clone needs somewhere to write under a read-only rootfs.
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: docs
              mountPath: /var/lib/nrp-ops-agent
            # Its own /tmp, not the agent's: the checkout is far larger than
            # anything the agent writes, and a shared 64Mi would fail the clone.
            - name: sync-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: allowlist
          configMap:
            name: nrp-ops-agent-allowlist
        # Written by docs-sync, read by the agent. Both containers get the pod's
        # fsGroup here, which is exactly what the CephFS PVC never delivered.
        - name: docs
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: sync-tmp
          emptyDir:
            sizeLimit: 2Gi
