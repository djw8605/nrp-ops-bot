---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrp-ops-agent
  namespace: system-nrp-ops-bot
  labels:
    app.kubernetes.io/name: nrp-ops-agent
spec:
  # Exactly one. Socket Mode delivers each event to a single connection, but two
  # replicas would each open one and both would answer the same mention.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nrp-ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nrp-ops-agent
    spec:
      serviceAccountName: nrp-ops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Placeholder. deploy/kustomization.yaml rewrites this to the real
          # registry and tag; the CI bump job edits it there, never here.
          image: ghcr.io/nrp/nrp-ops-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["nrp-ops-agent"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            # Slack and LLM credentials. Create with:
            #   kubectl -n system-nrp-ops-bot create secret generic nrp-ops-agent-tokens \
            #     --from-literal=NRP_OPS_SLACK_BOT_TOKEN=xoxb-... \
            #     --from-literal=NRP_OPS_SLACK_APP_TOKEN=xapp-... \
            #     --from-literal=NRP_OPS_LLM_API_KEY=...
            - secretRef:
                name: nrp-ops-agent-tokens
          env:
            # The NRP workspace (nrp-chat.slack.com), confirmed via auth.test
            # on 2026-08-14. An identifier, not a credential -- it belongs in
            # git. Events from any other team are refused, which is what closes
            # the Slack Connect hole: the *envelope* team is checked, never the
            # inner event's team, which for a Connect message is the author's
            # workspace rather than this one.
            - name: NRP_OPS_SLACK_TEAM_ID
              value: "T0B355062KS"
            - name: NRP_OPS_ALLOWLIST_PATH
              value: /etc/nrp-ops-agent/allowlist.yaml
            - name: NRP_OPS_KUBE_MODE
              value: incluster
            - name: NRP_OPS_PROMETHEUS_BASE_URL
              value: https://thanos.nrp-nautilus.io
            - name: NRP_OPS_LLM_BASE_URL
              value: https://ellm.nrp-nautilus.io/v1
            # Verified to emit OpenAI-style tool_calls, which the loop depends
            # on. Not a secret, so it is set here rather than in the Secret --
            # and it MUST be, because an explicit `env` entry overrides the same
            # key arriving via `envFrom`: an empty value here would win over a
            # correct one in the Secret and the pod would refuse to start.
            - name: NRP_OPS_LLM_MODEL
              value: "deepseek-v4-flash"
            - name: NRP_OPS_DOCS_DB_PATH
              value: /var/lib/nrp-ops-agent/docs.sqlite3
            - name: NRP_OPS_AUDIT_STREAM
              value: stdout
            - name: NRP_OPS_RATE_LIMIT_PER_HOUR
              value: "10"
          volumeMounts:
            - name: allowlist
              mountPath: /etc/nrp-ops-agent
              readOnly: true
            - name: docs
              mountPath: /var/lib/nrp-ops-agent
              readOnly: true
            # readOnlyRootFilesystem means anything that writes needs an explicit
            # mount. These are the only two paths that do.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import nrp_ops_agent"]
            initialDelaySeconds: 15
            periodSeconds: 60
      volumes:
        - name: allowlist
          configMap:
            name: nrp-ops-agent-allowlist
        - name: docs
          persistentVolumeClaim:
            claimName: nrp-ops-agent-docs
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nrp-ops-agent-docs
  namespace: system-nrp-ops-bot
  labels:
    app.kubernetes.io/name: nrp-ops-agent
spec:
  accessModes: ["ReadWriteMany"]  # the CronJob writes while the agent reads
  resources:
    requests:
      storage: 1Gi
  # One class per Ceph cluster. This pins the docs index to the *central*
  # cluster (provisioner rook-system.cephfs.csi.ceph.com), rather than the
  # `cephfs` class, which is a different cluster
  # (rook-ceph.cephfs.csi.ceph.com) and left this PVC Pending.
  #
  #   NOTE: storageClassName is immutable on an existing PVC. Changing it here
  #   does not migrate a live claim -- the claim must be deleted and recreated,
  #   or the sync fails with a field-immutable error.
  storageClassName: rook-cephfs-central
