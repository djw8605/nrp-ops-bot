---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nrp-ops-agent
  namespace: system-nrp-ops-bot
  labels:
    app.kubernetes.io/name: nrp-ops-agent
# The pod does need this token to call the Kubernetes API, so it is mounted --
# but the token is only as powerful as clusterrole.yaml, which is read-only.
automountServiceAccountToken: true
